[package]
name = "ohos-http"
version = "1.4.0"
edition = "2021"
description = "A high-performance HTTP server for HarmonyOS and Linux x86_64"
license = "Apache-2.0"

[[bin]]
name = "ohosHttp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
mime_guess = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
regex = "1"
bytes = "1"
http = "1"
libc = "0.2"
socket2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
quinn = "0.11"
h3 = "0"
h3-quinn = "0"
rand = "0.8"
lru = "0.12"
flate2 = "1"
sha1_smol = "1"
base64 = "0.22"
